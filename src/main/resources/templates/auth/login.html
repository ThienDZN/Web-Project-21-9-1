<!doctype html><html xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Example 1 login</title></head><body><main><h1>Example 1 login</h1><p th:if="${param.error}">Invalid email or password.</p><p th:if="${param.logout}">Logged out.</p><form th:action="@{/login}" method="post"><label>Email <input type="email" name="email" required autofocus></label><label>Password <input type="password" name="password" required></label><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Log in</button></form></main></body></html>
